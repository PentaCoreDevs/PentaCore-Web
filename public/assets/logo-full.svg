<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="fullBracketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B66FF" />
      <stop offset="100%" stop-color="#22B69A" />
    </linearGradient>
  </defs>

  <!-- Symbol Container -->
  <g transform="translate(6, 8)">
