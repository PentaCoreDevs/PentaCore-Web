    <!-- < -->
    <path d="M 23 21 L 11 32 L 23 43" stroke="url(#fullBracketGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- ; -->
    <circle cx="32" cy="26" r="2.8" fill="#55D6BE" />
    <path d="M 32 34 C 32 36 31.5 38 30.5 39.5 C 29.5 41 27.5 42 25.5 42.5" stroke="#55D6BE" stroke-width="2.5" stroke-linecap="round" />
    <!-- > -->
